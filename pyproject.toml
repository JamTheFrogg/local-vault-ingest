[project]
name = "vault-ingest"
version = "0.1.0"
description = "Turn client call transcripts into chunked, searchable Obsidian notes for AI agents."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "watchdog>=4.0",
  "pillow>=10.0",
  "rapidfuzz>=3",
  # meeting companion: Windows, macOS and Linux
  "psutil>=5.9",
  "pynput>=1.7",
  "pystray>=0.19",
  "pycaw>=20240316; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "windows-toasts>=1.1; sys_platform == 'win32'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
transcribe = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
]

[project.scripts]
vault-ingest = "vault_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vault_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
